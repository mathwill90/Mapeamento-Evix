name: Build Conversor PDF para TXT (Windows .exe)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - claude/pdf-txt-gui-converter-ifabq0
    paths:
      - "conversor-pdf-txt/**"
      - ".github/workflows/build-conversor-pdf-txt.yml"

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: conversor-pdf-txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "ConversorPDFparaTXT"
          --collect-all docling
          --collect-all docling_core
          --collect-all docling_parse
          --collect-all docling_ibm_models
          --collect-all easyocr
          --collect-all rapidocr
          conversor_pdf_txt.py

      - name: Check for code signing certificate
        id: check_cert
        shell: bash
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
        run: |
          if [ -n "$CODE_SIGNING_PFX_BASE64" ]; then
            echo "has_cert=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign executable
        if: steps.check_cert.outputs.has_cert == 'true'
        shell: pwsh
        working-directory: conversor-pdf-txt
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGNING_PFX_BASE64))
          $securePwd = ConvertTo-SecureString -String $env:CODE_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $cert = Get-PfxCertificate -FilePath $pfxPath -Password $securePwd
          Set-AuthenticodeSignature -FilePath "dist\ConversorPDFparaTXT.exe" -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
          Remove-Item $pfxPath
          Get-AuthenticodeSignature "dist\ConversorPDFparaTXT.exe" | Format-List

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConversorPDFparaTXT-windows
          path: |
            conversor-pdf-txt/dist/ConversorPDFparaTXT.exe
            conversor-pdf-txt/certificado/ConversorPDFparaTXT.cer
          if-no-files-found: error
